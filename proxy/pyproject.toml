[project]
name = "pluck-proxy"
version = "0.1.0"
description = "Pluck proxy: renders a shop page (plain HTTP -> FlareSolverr -> Chromium), strips it, answers with an explicit outcome (contract v1)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "curl_cffi>=0.7",
    "httpx>=0.27",
    "lxml>=5.2",
    "lxml_html_clean>=0.2",
    "readability-lxml>=0.8.1",
    "playwright>=1.45",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["pluck_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
